# ── Shire Jama LMS · Cloudflare Workers deployment ────────────────────────
# Deploy:  CLOUDFLARE_API_TOKEN=… npx wrangler deploy
name = "shirejama"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# SPA served from Workers Assets (free + unlimited static requests);
# /api/* always hits the Worker.
[assets]
directory = "../public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/robots.txt", "/sitemap.xml"]

[[d1_databases]]
binding = "DB"
database_name = "shirejama-v2"
database_id = "3a32d00a-45c1-4e45-bea4-1929a12b3195"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shirejama-media"

[triggers]
crons = ["*/30 * * * *"]
