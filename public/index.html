      <h1>Shire Jama'a Ahmed Adult School — Education Without Limits</h1>
      <p><em>Aqoon la'aan waa iftiin la'aan</em> — without knowledge, there is no light.</p>
      <p>Shire Jama'a Ahmed Adult School educates adult learners from Class 1 to Form 4 in reading,
         writing, English, mathematics and practical life skills. Students learn through an online
         portal with interactive lessons, videos, quizzes, tracked progress and certificates —
         on any phone, anywhere, at any pace.</p>
      <h2>What we offer</h2>
      <ul>
        <li>Adult basic education — Class 1 to Class 8</li>
        <li>Secondary preparation — Form 1 to Form 4</li>
        <li>English language foundations: reading, writing, grammar</li>
        <li>Mathematics and practical skills for daily life and work</li>
        <li>Quizzes with instant feedback and teacher-graded assignments</li>
      </ul>
      <h2>Portal access</h2>

         provisioning are handled by the school office.</p>
